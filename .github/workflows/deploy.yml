name: ci

on:
  push:
    branches:
      - 'main'
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: b14g


jobs:
  point-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/point-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/point-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::602951638934:role/github-action
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Update image
        run: |
          kubectl set image deployment/point-service \
            point-service=${{ secrets.DOCKERHUB_USERNAME }}/point-service:${{ github.sha }}

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/point-service --timeout=5m

      - name: Show image
        run: |
          kubectl get deployment point-service -o=jsonpath='{.spec.template.spec.containers[0].image}'
          echo
          